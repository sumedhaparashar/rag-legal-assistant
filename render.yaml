# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rag-legal-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile

    healthCheckPath: /health

    envVars:
      # ── LLM (Groq) ──────────────────────────────────────────
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_TEMPERATURE
        value: "0.2"

      # ── Embedding model ──────────────────────────────────────
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2

      # ── Retriever ────────────────────────────────────────────
      - key: RETRIEVER_K
        value: "5"
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"

      # ── Supabase Auth ────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ── CORS ─────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        value: "https://rag-legal-assistant-1.onrender.com"
      

      # ── Auto-ingest (disabled by default) ────────────────────
      - key: SCRAPE_URL
        value: ""
      - key: AUTO_INGEST_INTERVAL_HOURS
        value: "0"

      # ── Performance ──────────────────────────────────────────
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: LOG_LEVEL
        value: "INFO"