<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Corporate Law Assistant — AI-powered legal research with cited sources for Indian corporate law.">
  <title>Sign In — Corporate Law Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>

  <main class="page-auth" role="main">
    <div class="auth-card" id="auth-card">
      <!-- Logo & Branding -->
      <div class="auth-logo" aria-hidden="true">⚖️</div>
      <h1 class="auth-title">Corporate Law Assistant</h1>
      <p class="auth-tagline">AI-powered legal research with cited sources</p>

      <!-- Tabs -->
      <div class="auth-tabs" role="tablist" aria-label="Authentication method">
        <button class="auth-tab active" id="tab-signin" role="tab" aria-selected="true" aria-controls="form-auth" data-mode="signin">Sign In</button>
        <button class="auth-tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="form-auth" data-mode="signup">Sign Up</button>
      </div>

      <!-- Error Message -->
      <div class="auth-error" id="auth-error" role="alert" aria-live="polite">
        <span>⚠️</span>
        <span id="auth-error-text"></span>
      </div>

      <!-- Google Sign-In -->
      <button class="btn-google" id="btn-google" type="button" aria-label="Continue with Google">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="auth-divider">or continue with email</div>

      <!-- Email/Password Form -->
      <form id="form-auth" autocomplete="on" novalidate>
        <div class="form-group">
          <label class="form-label" for="auth-email">Email address</label>
          <input class="form-input" type="email" id="auth-email" name="email" placeholder="you@company.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="auth-password">Password</label>
          <input class="form-input" type="password" id="auth-password" name="password" placeholder="••••••••" required autocomplete="current-password" minlength="6">
        </div>
        <button class="btn-primary" type="submit" id="btn-submit">Sign In</button>
      </form>

      <!-- Footer -->
      <p class="auth-footer">By continuing, you agree to our Terms of Service<br>and acknowledge our Privacy Policy.</p>
    </div>
  </main>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (() => {
      // ── State ──
      let supabase = null;
      let mode = 'signin'; // 'signin' | 'signup'

      // ── DOM ──
      const tabSignIn   = document.getElementById('tab-signin');
      const tabSignUp   = document.getElementById('tab-signup');
      const btnGoogle   = document.getElementById('btn-google');
      const form        = document.getElementById('form-auth');
      const btnSubmit   = document.getElementById('btn-submit');
      const emailInput  = document.getElementById('auth-email');
      const passInput   = document.getElementById('auth-password');
      const errorBox    = document.getElementById('auth-error');
      const errorText   = document.getElementById('auth-error-text');

      // ── Helpers ──
      function showError(msg) {
        errorText.textContent = msg;
        errorBox.classList.add('visible');
      }

      function hideError() {
        errorBox.classList.remove('visible');
      }

      function setLoading(loading) {
        btnSubmit.disabled = loading;
        btnGoogle.disabled = loading;
        btnSubmit.textContent = loading
          ? (mode === 'signin' ? 'Signing in…' : 'Creating account…')
          : (mode === 'signin' ? 'Sign In' : 'Create Account');
      }

      function switchMode(newMode) {
        mode = newMode;
        hideError();
        if (mode === 'signin') {
          tabSignIn.classList.add('active');
          tabSignIn.setAttribute('aria-selected', 'true');
          tabSignUp.classList.remove('active');
          tabSignUp.setAttribute('aria-selected', 'false');
          btnSubmit.textContent = 'Sign In';
          passInput.autocomplete = 'current-password';
        } else {
          tabSignUp.classList.add('active');
          tabSignUp.setAttribute('aria-selected', 'true');
          tabSignIn.classList.remove('active');
          tabSignIn.setAttribute('aria-selected', 'false');
          btnSubmit.textContent = 'Create Account';
          passInput.autocomplete = 'new-password';
        }
      }

      // ── Initialization ──
      async function init() {
        try {
          const res = await fetch('/api/auth/config');
          const config = await res.json();

          // If auth is not configured, skip to chat
          if (!config.supabase_url) {
            window.location.replace('/ui/index.html');
            return;
          }

          // Initialize Supabase
          supabase = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);

          // Check if already logged in
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            window.location.replace('/ui/index.html');
            return;
          }

          // Listen for auth changes (handles OAuth redirects)
          supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
              window.location.replace('/ui/index.html');
            }
          });

          // Show the auth card
          document.getElementById('auth-card').style.opacity = '1';

        } catch (err) {
          console.error('Auth config error:', err);
          // If config fetch fails, maybe server is running without auth
          window.location.replace('/ui/index.html');
        }
      }

      // ── Event Listeners ──
      tabSignIn.addEventListener('click', () => switchMode('signin'));
      tabSignUp.addEventListener('click', () => switchMode('signup'));

      // Google Sign-In
      btnGoogle.addEventListener('click', async () => {
        if (!supabase) return;
        hideError();
        setLoading(true);
        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin + '/ui/index.html'
            }
          });
          if (error) throw error;
        } catch (err) {
          showError(err.message || 'Google sign-in failed. Please try again.');
          setLoading(false);
        }
      });

      // Email/Password Form
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!supabase) return;

        hideError();
        const email = emailInput.value.trim();
        const password = passInput.value;

        if (!email || !password) {
          showError('Please enter both email and password.');
          return;
        }
        if (password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }

        setLoading(true);

        try {
          let result;
          if (mode === 'signin') {
            result = await supabase.auth.signInWithPassword({ email, password });
          } else {
            result = await supabase.auth.signUp({ email, password });
          }

          if (result.error) throw result.error;

          if (mode === 'signup' && result.data?.user && !result.data.session) {
            // Email confirmation required
            showError('Check your email for a confirmation link.');
            setLoading(false);
            return;
          }

          // Successful sign-in — redirect handled by onAuthStateChange
          // But as fallback:
          if (result.data?.session) {
            window.location.replace('/ui/index.html');
          }
        } catch (err) {
          showError(err.message || 'Authentication failed. Please try again.');
          setLoading(false);
        }
      });

      // ── Boot ──
      init();
    })();
  </script>
</body>
</html>
